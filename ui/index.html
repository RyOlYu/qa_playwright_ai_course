<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Северная полка</title>

    <link href="/bootstrap.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        [data-testid="catalog-row"] {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app" class="min-vh-100"></div>

    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true" data-testid="app-error">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ошибка</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>

                <div class="modal-body">
                    <p class="mb-1">
                        <span class="fw-semibold">Код:</span>
                        <span data-testid="app-error-code"></span>
                    </p>

                    <p class="mb-0" data-testid="app-error-message"></p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                        data-testid="app-error-close">
                        Закрыть
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/bootstrap.js"></script>

    <script type="module" src="/app.js"></script>
</body>

</html>
